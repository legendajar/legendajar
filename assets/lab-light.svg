<svg xmlns="http://www.w3.org/2000/svg" width="840" height="172" viewBox="0 0 840 172" role="img"><title>In the lab</title><defs></defs><rect x="0.5" y="0.5" width="839" height="171" rx="16" fill="#f6f5f2" stroke="#12121614"/><text x="32" y="40" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="500" fill="#d1003f" text-anchor="start" letter-spacing="1.2">IN THE LAB</text><text x="808" y="40" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="400" fill="#6a6a74" text-anchor="end" letter-spacing="0">in progress</text><circle cx="38" cy="71" r="4" fill="none" stroke="#d1003f" stroke-width="1.5"/><text x="54" y="76" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#121216" text-anchor="start" letter-spacing="0">Local RAG pipeline</text><text x="260" y="76" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b4b55" text-anchor="start" letter-spacing="0">Ingest, query and answer over your own files, fully offline.</text><circle cx="38" cy="103" r="4" fill="none" stroke="#d1003f" stroke-width="1.5"/><text x="54" y="108" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#121216" text-anchor="start" letter-spacing="0">Portfolio MCP server</text><text x="260" y="108" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b4b55" text-anchor="start" letter-spacing="0">My projects, skills and résumé, exposed to any MCP client.</text><circle cx="38" cy="135" r="4" fill="none" stroke="#d1003f" stroke-width="1.5"/><text x="54" y="140" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#121216" text-anchor="start" letter-spacing="0">Job-search automation</text><text x="260" y="140" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif" font-